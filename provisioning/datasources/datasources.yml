apiVersion: 1
datasources:
  - name: ScopeDB
    uid: scopedb
    type: scopedb-scopedb-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      endpoint: $SCOPEDB_ENDPOINT
      timeoutSeconds: 30
      maxConcurrentQueries: 4
    secureJsonData:
      apiKey: $SCOPEDB_API_KEY
