name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: scopedb-grafana-unsigned-linux-amd64
          path: dist/*.zip
