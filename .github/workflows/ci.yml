name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e 'const {version} = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version");'
      - run: make build
      - run: make test
      - run: make lint
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: scopedb-grafana-unsigned-linux-amd64
          path: dist/*.zip*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scopedb-grafana-unsigned-linux-amd64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Unsigned Linux amd64 build for Grafana OSS 13.1.0. [Installation](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install)." \
            "${args[@]}"
